# HopSync modpack definition. This is the only file you need to edit.
# Docs: README.md. Validate locally with: python3 scripts/hopsync.py build

[pack]
name = "HopSync Demo"
version = "1.0.0"
description = ""
minecraft = "1.21.1"
loader = "neoforge"
# server_ip = "play.example.net"

[configs]
